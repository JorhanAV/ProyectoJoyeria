<div class="modal-overlay" (click)="cerrar()"></div>
<div class="modal-contenido">
  <h2>{{'RESENAS_TEXT.REPORTAR_RESENA' | translate}}</h2>
  <p><strong>{{'RESENAS_TEXT.USUARIO' | translate}}:</strong> {{ resena?.usuario.nombre_usuario }}</p>
  <p><strong>{{'RESENAS_TEXT.COMENTARIO' | translate}}:</strong> “{{ resena?.comentario }}”</p>

  <textarea
    [(ngModel)]="comentario"
    placeholder="{{'RESENAS_TEXT.MOTIVO_REPORTE' | translate}}"
    rows="4"
  ></textarea>

  <div class="acciones">
    <button (click)="enviarReporte()" class="boton">{{'RESENAS_TEXT.ENVIAR' | translate}}</button>
    <button class="cancelar" (click)="cerrar()" class="boton">{{'RESENAS_TEXT.CANCELAR' | translate}}</button>
  </div>
</div>
