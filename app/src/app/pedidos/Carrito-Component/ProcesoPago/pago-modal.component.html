<div class="pago-modal-container">
  <h2 class="dialog-title">Pago con {{ metodo_pago | titlecase }}</h2>

  <div mat-dialog-content class="dialog-content">
    <!-- Total a pagar -->
    <div class="total-box">
      <label>Total a pagar:</label>
      <strong>{{ total | currency : "CRC" }}</strong>
    </div>

    <!-- Efectivo -->
    <ng-container *ngIf="metodo_pago === 'Efectivo'">
      <form class="form-grid">
        <label for="monto">Monto recibido</label>
        <div class="input-moneda">
          <span class="simbolo">₡</span>
          <input
            id="monto"
            type="number"
            [value]="montoRecibido()"
            (input)="montoRecibido.set($any($event.target).valueAsNumber)"
            placeholder="{{ total }}"
          />
        </div>

        <label for="vuelto">Vuelto</label>
        <div class="vuelto-box">
          {{ vuelto() | currency : "CRC" }}
        </div>

        <div *ngIf="error()" class="pago-error">{{ error() }}</div>
      </form>
    </ng-container>

    <!-- Tarjeta -->
    <ng-container *ngIf="metodo_pago.startsWith('Tarjeta')">
      <label>Número de tarjeta</label>
      <input
        type="text"
        [(ngModel)]="tarjeta.numero"
        maxlength="16"
        inputmode="numeric"
        placeholder="1234123412341234"
      />

      <label>Fecha de expiración (MM/AA)</label>
      <input
        type="text"
        [(ngModel)]="tarjeta.expiracion"
        maxlength="5"
        placeholder="MM/AA"
      />

      <label>CVV</label>
      <input
        type="text"
        [(ngModel)]="tarjeta.cvv"
        maxlength="4"
        inputmode="numeric"
        placeholder="123"
      />

      <label>Nombre del titular</label>
      <input
        type="text"
        [(ngModel)]="tarjeta.titular"
        placeholder="Juan Pérez"
      />

      <div *ngIf="error()" class="pago-error">{{ error() }}</div>
    </ng-container>
  </div>

  <div mat-dialog-actions class="pago-botones">
    <button class="btn-cancelar" (click)="cancelar()">Cancelar</button>
    <button class="btn-confirmar" (click)="confirmar()">Confirmar</button>
  </div>
</div>
