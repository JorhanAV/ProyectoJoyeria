<div class="pago-modal-container">
  <h2 class="dialog-title">
    {{ 'CARRITO_TEXT.PAGO_TITULO' | translate:{ metodo_pago: metodo_pago | titlecase } }}
  </h2>

  <div mat-dialog-content class="dialog-content">
    <!-- Total a pagar -->
    <div class="total-box">
      <label>{{ 'CARRITO_TEXT.TOTAL_A_PAGAR' | translate }}:</label>
      <strong>{{ total | currency : "CRC" }}</strong>
    </div>

    <!-- Efectivo -->
    <ng-container *ngIf="metodo_pago === 'Efectivo'">
      <form class="form-grid">
        <label for="monto">{{ 'CARRITO_TEXT.MONTO_RECIBIDO' | translate }}</label>
        <div class="input-moneda">
          <span class="simbolo">₡</span>
          <input
            id="monto"
            type="number"
            [value]="montoRecibido()"
            (input)="montoRecibido.set($any($event.target).valueAsNumber)"
            [placeholder]="total"
          />
        </div>

        <label for="vuelto">{{ 'CARRITO_TEXT.VUELTO' | translate }}</label>
        <div class="vuelto-box">
          {{ vuelto() | currency : "CRC" }}
        </div>

        <div *ngIf="error()" class="pago-error">
          {{ 'CARRITO_TEXT.ERROR_PAGO' | translate:{ error: error() } }}
        </div>
      </form>
    </ng-container>

    <!-- Tarjeta -->
    <ng-container *ngIf="metodo_pago.startsWith('Tarjeta')">
      <label>{{ 'CARRITO_TEXT.NUMERO_TARJETA' | translate }}</label>
      <input
        type="text"
        [(ngModel)]="tarjeta.numero"
        maxlength="16"
        inputmode="numeric"
        placeholder="1234123412341234"
      />

      <label>{{ 'CARRITO_TEXT.EXPIRACION' | translate }}</label>
      <input
        type="text"
        [(ngModel)]="tarjeta.expiracion"
        maxlength="5"
        placeholder="MM/AA"
      />

      <label>{{ 'CARRITO_TEXT.CVV' | translate }}</label>
      <input
        type="text"
        [(ngModel)]="tarjeta.cvv"
        maxlength="4"
        inputmode="numeric"
        placeholder="123"
      />

      <label>{{ 'CARRITO_TEXT.TITULAR' | translate }}</label>
      <input
        type="text"
        [(ngModel)]="tarjeta.titular"
        placeholder="Juan Pérez"
      />

      <div *ngIf="error()" class="pago-error">
        {{ 'CARRITO_TEXT.ERROR_PAGO' | translate:{ error: error() } }}
      </div>
    </ng-container>
  </div>

  <div mat-dialog-actions class="pago-botones">
    <button class="btn-cancelar" (click)="cancelar()">
      {{ 'CARRITO_TEXT.CANCELAR' | translate }}
    </button>
    <button class="btn-confirmar" (click)="confirmar()">
      {{ 'CARRITO_TEXT.CONFIRMAR' | translate }}
    </button>
  </div>
</div>
