<div class="page-wrapper">
  <div class="login-container">
    <h2>{{ "USER_TEXT.INICIAR_SESION" | translate }}</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label for="correo">{{ "USER_TEXT.CORREO_ELECTRONICO" | translate }}</label>
      <input id="correo" formControlName="correo" type="email" required />

      <label for="contraseña">{{ "USER_TEXT.CONTRASENA" | translate }}</label>
      <input id="contraseña" formControlName="contraseña" type="password" required />

      <button type="submit" [disabled]="loginForm.invalid">{{ "USER_TEXT.INICIAR_SESION" | translate }}</button>
    </form>

    <p>{{ "USER_TEXT.NO_TIENES_CUENTA" | translate }} <a routerLink="/user-create">{{ "USER_TEXT.CREAR_CUENTA" | translate }}</a></p>
  </div>
</div>
