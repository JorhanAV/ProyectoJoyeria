<div class="page-wrapper">
  <div class="register-container">
    <h2>{{ "USER_TEXT.CREAR_CUENTA" | translate }}</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <label for="email">{{ "USER_TEXT.CORREO_ELECTRONICO" | translate }}</label>
      <input id="email" formControlName="email" type="email" required />

      <label for="password">{{ "USER_TEXT.CONTRASENA" | translate }}</label>
      <input id="password" formControlName="password" type="password" required />

      <label for="confirmPassword">{{ "USER_TEXT.CONFIRMAR_CONTRASENA" | translate }}</label>
      <input id="confirmPassword" formControlName="confirmPassword" type="password" required />

      <button type="submit" [disabled]="registerForm.invalid">{{ "USER_TEXT.REGISTRARSE" | translate }}</button>
    </form>

    <p>{{ "USER_TEXT.NO_TIENES_CUENTA" | translate }} <a routerLink="/auth/login">{{ "USER_TEXT.INICIAR_SESION" | translate }}</a></p>
  </div>
</div>
