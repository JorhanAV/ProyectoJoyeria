<div class="page-wrapper">
  <div class="register-container">
    <h2>{{ "USER_TEXT.CREAR_CUENTA" | translate }}</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <input type="hidden" formControlName="rol" />

      <label for="nombre_usuario"
        >{{ "USER_TEXT.NOMBRE_USUARIO" | translate }}</label
      >
      <input
        id="nombre_usuario"
        formControlName="nombre_usuario"
        type="text"
        required
      />

      <label for="correo"
        >{{ "USER_TEXT.CORREO_ELECTRONICO" | translate }}</label
      >
      <input id="correo" formControlName="correo" type="email" required />

      <label for="contraseña">{{ "USER_TEXT.CONTRASENA" | translate }}</label>
      <input
        id="contraseña"
        formControlName="contraseña"
        type="password"
        required
      />

      <label for="confirmarContraseña"
        >{{ "USER_TEXT.CONFIRMAR_CONTRASENA" | translate }}</label
      >
      <input
        id="confirmarContraseña"
        formControlName="confirmarContraseña"
        type="password"
        required
      />

      <button type="submit" [disabled]="registerForm.invalid">
        {{ "USER_TEXT.REGISTRARSE" | translate }}
      </button>
    </form>

    <p>
      {{ "USER_TEXT.YA_TIENES_CUENTA" | translate }}
      <a routerLink="/auth/login"
        >{{ "USER_TEXT.INICIAR_SESION" | translate }}</a
      >
    </p>
  </div>
</div>
