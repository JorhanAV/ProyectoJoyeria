<div class="page-wrapper">
  <div class="pass-container" *ngIf="passForm">
    <h2>{{ 'USER_TEXT.TITULO_RESTABLECER' | translate }}</h2>

    <form [formGroup]="passForm" (ngSubmit)="guardar()">
      <div class="form-group password-group">
        <label>{{ 'USER_TEXT.CONTRASENA_ACTUAL' | translate }}</label>
        <input
          [type]="mostrarActual ? 'text' : 'password'"
          formControlName="actual"
          class="input-field"
        />
        <span class="toggle-icon" (click)="toggleActual()">
          <i [class]="mostrarActual ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
        </span>
        <div class="error" *ngIf="errorActualIncorrecta">
          La contraseña actual es incorrecta
        </div>
      </div>

      <div class="form-group password-group">
        <label>{{ 'USER_TEXT.NUEVA_CONTRASENA' | translate }}</label>
        <input
          [type]="mostrarNueva ? 'text' : 'password'"
          formControlName="nueva"
          class="input-field"
        />
        <span class="toggle-icon" (click)="toggleNueva()">
          <i [class]="mostrarNueva ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
        </span>
        <div
          class="error"
          *ngIf="passForm.get('nueva')?.errors?.['weakPassword'] && passForm.get('nueva')?.touched"
        >
          La contraseña debe incluir mayúsculas, minúsculas, números y
          caracteres especiales
        </div>
      </div>

      <div class="form-group password-group">
        <label>{{ 'USER_TEXT.CONFIRMAR_CONTRASENA' | translate }}</label>
        <input
          [type]="mostrarConfirmar ? 'text' : 'password'"
          formControlName="confirmar"
          class="input-field"
        />
        <span class="toggle-icon" (click)="toggleConfirmar()">
          <i [class]="mostrarConfirmar ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
        </span>
        <div class="error" *ngIf="passForm.errors?.['noCoincide']">
          Las contraseñas no coinciden
        </div>
      </div>

      <button
        type="submit"
        [disabled]="passForm.invalid || passForm.errors?.['noCoincide']"
        class="btn-guardar"
      >
        {{ 'USER_TEXT.GUARDAR_CAMBIOS' | translate }}
      </button>
    </form>
  </div>
</div>
