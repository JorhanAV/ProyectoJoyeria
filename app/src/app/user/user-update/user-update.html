<div class="perfil-container" *ngIf="perfilForm">
  <h2>{{ 'USER_TEXT.TITULO' | translate }}</h2>

  <form [formGroup]="perfilForm" (ngSubmit)="guardar()">
    <!-- Nombre de usuario -->
    <div class="form-group">
      <label>{{ 'USER_TEXT.NOMBRE_USUARIO' | translate }}</label>
      <input type="text" formControlName="nombre_usuario" class="input-field" />
    </div>

    <!-- Correo electrónico -->
    <div class="form-group">
      <label>{{ 'USER_TEXT.CORREO' | translate }}</label>
      <input type="email" formControlName="correo" class="input-field" />
    </div>
    <div
      class="error"
      *ngIf="perfilForm.get('correo')?.errors?.['emailExists']"
    >
      Este correo ya está registrado por otro usuario
    </div>

    <!-- Tipo de usuario -->
    <div class="form-group">
      <label>{{ 'USER_TEXT.TIPO_USUARIO' | translate }}</label>

      <ng-container *ngIf="esAdminLogueado; else soloLectura">
        <div class="select-wrapper">
          <select formControlName="rol" class="select-field">
            <option value="ADMIN">
              {{ 'USER_TEXT.ROL_ADMIN' | translate }}
            </option>
            <option value="CLIENTE">
              {{ 'USER_TEXT.ROL_CLIENTE' | translate }}
            </option>
          </select>
        </div>
      </ng-container>

      <ng-template #soloLectura>
        <input
          type="text"
          [value]="perfilForm.get('rol')?.value"
          class="input-field"
          disabled
        />
      </ng-template>
    </div>

    <!-- Botón de guardar -->
    <button type="submit" [disabled]="perfilForm.invalid" class="btn-guardar">
      {{ 'USER_TEXT.GUARDAR' | translate }}
    </button>
  </form>
</div>
